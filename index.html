<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葵涌堂悅曆 · 推播管理控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans TC', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="flex items-center gap-3 border-b border-slate-700/80 pb-5">
            <div class="w-12 h-12 bg-gradient-to-tr from-purple-600 to-indigo-500 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">推播廣播控制器</h1>
                <p class="text-xs text-slate-400">CCAGKC Church Calendar · Admin Console</p>
            </div>
        </div>

        <!-- 1. 登入區塊 (未登入時顯示) -->
        <div id="loginSection" class="space-y-4">
            <p class="text-sm text-slate-300">請使用管理員帳號密碼進行安全驗證：</p>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">管理員 Passcode</label>
                <input type="password" id="adminPassword" placeholder="請輸入管理員密碼" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 transition">
            </div>
            <button id="loginBtn" className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3.5 rounded-xl transition shadow-md">
                安全驗證並登入
            </button>
        </div>

        <!-- 2. 控制台表單區塊 (已登入時顯示) -->
        <form id="pushForm" class="hidden space-y-4">
            <div class="bg-purple-950/40 border border-purple-800/50 p-3 rounded-xl flex justify-between items-center text-xs text-purple-200">
                <span><i class="fa-solid fa-user-shield mr-1"></i> 管理員身份已確認</span>
                <button type="button" id="logoutBtn" class="text-slate-400 hover:text-white underline">登出</button>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">推播標題</label>
                <input type="text" id="pushTitle" placeholder="例如：🕊️ 葵涌堂每日靈修" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 transition" required>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">推播內文</label>
                <textarea id="pushBody" rows="3" placeholder="例如：今日聖言已更新，點擊進入閱讀。" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 transition" required></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">點擊跳轉網址</label>
                <input type="url" id="targetUrl" value="https://ccagkc.github.io/ChurchCalendar/" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500 transition">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> 發布廣播任務至佇列
            </button>
        </form>

        <div id="statusBox" class="hidden p-4 rounded-xl text-sm border font-medium"></div>
    </div>

    <!-- Firebase Web SDK (完全不需要 Private Key) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 💡 與主應用完全相同的公共 Config (絕對公開安全)
        const firebaseConfig = {
            apiKey: "AIzaSyAEMB-eVojfzcUMyKt9JgGK_okPRO2V73g",
            authDomain: "ccagkc-biblereading-project.firebaseapp.com",
            databaseURL: "https://ccagkc-biblereading-project-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ccagkc-biblereading-project",
            storageBucket: "ccagkc-biblereading-project.firebasestorage.app",
            messagingSenderId: "962459311265",
            appId: "1:962459311265:web:cbad43a46491a046e5e4e0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "admin@admin.kcc.app";

        const loginSection = document.getElementById('loginSection');
        const pushForm = document.getElementById('pushForm');
        const statusBox = document.getElementById('statusBox');

        // 監聽登入狀態
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                loginSection.classList.add('hidden');
                pushForm.classList.remove('hidden');
            } else {
                loginSection.classList.remove('hidden');
                pushForm.classList.add('hidden');
            }
        });

        // 管理員登入
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const pass = document.getElementById('adminPassword').value;
            try {
                await signInWithEmailAndPassword(auth, ADMIN_EMAIL, pass);
            } catch (err) {
                alert("密碼錯誤或驗證失敗！");
            }
        });

        // 登出
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // 提交推播廣播任務
        pushForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 寫入廣播任務中...`;
            statusBox.className = "hidden";

            try {
                // 將推播任務安全寫入 Firestore 佇列
                await addDoc(collection(db, "artifacts/ccagkc-ChurchCalendarApp/public/data/pushTasks"), {
                    title: document.getElementById('pushTitle').value,
                    body: document.getElementById('pushBody').value,
                    targetUrl: document.getElementById('targetUrl').value,
                    createdAt: new Date().toISOString(),
                    status: 'pending'
                });

                statusBox.className = "p-4 rounded-xl text-sm border font-medium bg-emerald-950/80 border-emerald-700 text-emerald-200";
                statusBox.innerHTML = `<i class="fa-solid fa-circle-check mr-2"></i> 推播廣播任務已成功寫入資料庫！系統將自動廣播至全體會員設備。`;
            } catch (err) {
                statusBox.className = "p-4 rounded-xl text-sm border font-medium bg-red-950/80 border-red-700 text-red-200";
                statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> 錯誤：${err.message}`;
            } finally {
                statusBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-bullhorn"></i> 發布廣播任務至佇列`;
            }
        });
    </script>
</body>
</html>
